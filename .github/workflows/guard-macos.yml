# guard-macos.yml — прогон guard на настоящем macOS (основной backend).
# Ничего нового не проверяет: собирает guard, печатает профиль Seatbelt,
# гоняет наши платформонезависимые тесты и приёмочный скрипт авторов.
# Запуск вручную: вкладка Actions → guard-macos → Run workflow.

name: guard-macos

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build guard
        run: go build -buildvcs=false -o guard ./cmd/guard

      - name: Check sandbox-exec is available
        run: |
          ls -l /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true && echo "sandbox-exec OK"

      - name: Seatbelt profile generated by guard
        run: |
          mkdir -p examples/ws
          ./guard profile --policy examples/policy.json

      - name: Platform-independent tests (filter, engine, key isolation)
        run: |
          pip install pytest
          python -m pytest -v tests/test_input_filter.py tests/test_filter_engine.py tests/test_key_isolation.py

      - name: Authors' acceptance script (attack/run_attacks.sh)
        continue-on-error: true
        run: sh attack/run_attacks.sh
